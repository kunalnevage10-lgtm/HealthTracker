<!DOCTYPE html>
<html>
<head>
    <title>HealthSync - Setup</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2c3e50; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; width: 350px; color: #333; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #219150; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="text-align: center;">Create Your Profile</h2>
        <form action="/setup" method="POST">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="number" name="age" placeholder="Age" required>
            <input type="number" step="0.1" name="weight" placeholder="Weight (kg)" required>
            <input type="number" step="0.01" name="height" placeholder="Height (meters e.g. 1.75)" required>
            <input type="number" name="goals" placeholder="Daily Step Goal" required>
            <button type="submit">Start Tracking</button>
        </form>
    </div>
</body>
</html>
